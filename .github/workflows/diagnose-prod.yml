name: Diagnose Command Center

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose VPS calendar
    runs-on: ubuntu-latest
    steps:
      - name: Check production calendar endpoint
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GUPPY_DEPLOY_HOST }}
          username: ${{ secrets.GUPPY_DEPLOY_USER }}
          key: ${{ secrets.GUPPY_DEPLOY_SSH_KEY }}
          port: 22
          script_stop: false
          script: |
            set -eu

            echo "== health =="
            curl -fsS http://127.0.0.1:8787/api/health || true
            echo

            echo "== calendar =="
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' http://127.0.0.1:8787/api/calendar || echo curl_failed)"
            echo "status=$code"
            if [ "$code" = "200" ]; then
              node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const days=Object.values(data.weeks||{}).flat(); const events=days.reduce((n,d)=>n+((d.events||[]).length),0); console.log(JSON.stringify({source:data.source,dayGroups:days.length,events}));" "$body"
            else
              head -c 2000 "$body"
              echo
            fi
            rm -f "$body"

            echo "== recent calendar service logs =="
            journalctl -u guppy-command-center.service -n 120 --no-pager | grep -Ei '\[gcal\]|Calendar|Token refresh|OAuth|service account|google' | tail -60 || true
